server:
  port: 1003

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:inventory-service}

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:inventory-service/.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVER:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      auto-offset-reset: earliest
      # Manual acknowledgment
      enable-auto-commit: false
      properties:
        schema.registry.url: ${AVRO_REGISTRY_URL:http://localhost:8081}
        specific.avro.reader: true
        group.protocol: consumer
    # Producer used by the DeadLetterPublishingRecoverer to write failed Avro records to *-dlt.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${AVRO_REGISTRY_URL:http://localhost:8081}
    listener:
      ack-mode: manual
    retry:
      interval: ${KAFKA_CONSUMER_RETRY_INTERVAL}
      multiplier: ${KAFKA_CONSUMER_RETRY_MULTIPLIER}
      max-duration: ${KAFKA_CONSUMER_MAX_RETRY_DURATION}