services:

  # ============================================================
  # POSTGRES
  # ============================================================

  postgres:
    image: postgres:17
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: ${POSTGRES_DATA_PATH}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:${POSTGRES_DATA_PATH}
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================
  # REDIS
  # ============================================================

  redis:
    image: redis:8-alpine
    container_name: REDIS
    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data


  # ============================================================
  # KAFKA
  # ============================================================
  #
  # Architecture:
  #
  # 3 Dedicated KRaft Controllers
  # 3 Kafka Brokers
  #
  # Controller quorum:
  #   1, 2, 3
  #
  # Broker nodes:
  #   101, 102, 103
  #
  # Data replication:
  #   replication.factor = 3
  #   min.insync.replicas = 2
  #
  # ============================================================


  # ============================================================
  # KRAFT CONTROLLER 1
  # ============================================================

  # ============================================================
  # KRAFT CONTROLLER 1
  # ============================================================

  kafka-controller-1:
    image: apache/kafka:4.0.1
    container_name: kafka-controller-1
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@kafka-controller-1:9093,
        2@kafka-controller-2:9093,
        3@kafka-controller-3:9093

      KAFKA_LISTENERS: CONTROLLER://:9093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_controller_1_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/9093' 2>/dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s


  # ============================================================
  # KRAFT CONTROLLER 2
  # ============================================================

  kafka-controller-2:
    image: apache/kafka:4.0.1
    container_name: kafka-controller-2
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@kafka-controller-1:9093,
        2@kafka-controller-2:9093,
        3@kafka-controller-3:9093

      KAFKA_LISTENERS: CONTROLLER://:9093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_controller_2_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/9093' 2>/dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s


  # ============================================================
  # KRAFT CONTROLLER 3
  # ============================================================

  kafka-controller-3:
    image: apache/kafka:4.0.1
    container_name: kafka-controller-3
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@kafka-controller-1:9093,
        2@kafka-controller-2:9093,
        3@kafka-controller-3:9093

      KAFKA_LISTENERS: CONTROLLER://:9093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_controller_3_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/9093' 2>/dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s


  # ============================================================
  # BROKER 1
  # ============================================================

  kafka-1:
    image: apache/kafka:4.0.1
    container_name: kafka-1
    restart: unless-stopped

    ports:
      - "${KAFKA_1_PORT}:9092"

    environment:

      KAFKA_NODE_ID: 101

      KAFKA_PROCESS_ROLES: broker

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@kafka-controller-1:9093,
        2@kafka-controller-2:9093,
        3@kafka-controller-3:9093

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka-1:29092,
        EXTERNAL://localhost:${KAFKA_1_PORT}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --------------------------------------------------------
      # REPLICATION
      # --------------------------------------------------------

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3

      KAFKA_MIN_INSYNC_REPLICAS: 2

      # --------------------------------------------------------
      # INTERNAL KAFKA TOPICS
      # --------------------------------------------------------

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      # --------------------------------------------------------
      # DEFAULT PARTITIONS
      # --------------------------------------------------------

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_1_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    depends_on:
      kafka-controller-1:
        condition: service_healthy
      kafka-controller-2:
        condition: service_healthy
      kafka-controller-3:
        condition: service_healthy


  # ============================================================
  # BROKER 2
  # ============================================================

  kafka-2:
    image: apache/kafka:4.0.1
    container_name: kafka-2
    restart: unless-stopped

    ports:
      - "${KAFKA_2_PORT}:9092"

    environment:

      KAFKA_NODE_ID: 102

      KAFKA_PROCESS_ROLES: broker

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@kafka-controller-1:9093,
        2@kafka-controller-2:9093,
        3@kafka-controller-3:9093

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka-2:29092,
        EXTERNAL://localhost:${KAFKA_2_PORT}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3

      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_2_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    depends_on:
      kafka-controller-1:
        condition: service_healthy
      kafka-controller-2:
        condition: service_healthy
      kafka-controller-3:
        condition: service_healthy


  # ============================================================
  # BROKER 3
  # ============================================================

  kafka-3:
    image: apache/kafka:4.0.1
    container_name: kafka-3
    restart: unless-stopped

    ports:
      - "${KAFKA_3_PORT}:9092"

    environment:

      KAFKA_NODE_ID: 103

      KAFKA_PROCESS_ROLES: broker

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@kafka-controller-1:9093,
        2@kafka-controller-2:9093,
        3@kafka-controller-3:9093

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka-3:29092,
        EXTERNAL://localhost:${KAFKA_3_PORT}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3

      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_3_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    depends_on:
      kafka-controller-1:
        condition: service_healthy
      kafka-controller-2:
        condition: service_healthy
      kafka-controller-3:
        condition: service_healthy


  # ============================================================
  # SCHEMA REGISTRY
  # ============================================================

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    container_name: SCHEMA_REGISTRY
    restart: unless-stopped

    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

    ports:
      - "${SCHEMA_REGISTRY_PORT}:8081"

    environment:

      SCHEMA_REGISTRY_HOST_NAME: schema-registry

      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

      # --------------------------------------------------------
      # Kafka bootstrap servers
      # --------------------------------------------------------
      #
      # IMPORTANT:
      # These are Docker service names.
      #
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: >-
        PLAINTEXT://kafka-1:29092,
        PLAINTEXT://kafka-2:29092,
        PLAINTEXT://kafka-3:29092

      # _schemas topic is now replicated across 3 brokers.
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8081/subjects > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  # ============================================================
  # KAFKA UI
  # ============================================================

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: KAFKA_UI
    restart: unless-stopped

    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

    ports:
      - "${KAFKA_UI_PORT}:8080"

    environment:

      KAFKA_CLUSTERS_0_NAME: local

      # Kafka UI is inside Docker.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092

      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081


# ==============================================================
# VOLUMES
# ==============================================================

volumes:
  kafka_controller_1_data:
  kafka_controller_2_data:
  kafka_controller_3_data:

  postgres_data:
  redis_data:

  kafka_1_data:
  kafka_2_data:
  kafka_3_data: