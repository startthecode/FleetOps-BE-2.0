version: "3.9"

services:
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis-data:/data

    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}

volumes:
  redis-data: